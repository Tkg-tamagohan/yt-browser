[package]
name = "yt-browser"
version = "0.11.6"
description = "YouTube 専用ブラウザ（専ブラ）"
authors = ["Tkg-tamagohan"]
edition = "2021"

[lib]
# `_lib` サフィックスは冗長に見えるが、lib 名と bin 名の衝突を避けるために必要。
# 主に Windows 向けの問題。https://github.com/rust-lang/cargo/issues/8519
name = "yt_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "sync",
  "time",
] }
url = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
roxmltree = "0.20"
aho-corasick = "1"
regex = "1"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"
open = { version = "5", features = ["shellexecute-on-windows"] }
tauri-plugin-clipboard-manager = "=2.4.1"
# 新着のデスクトップ通知（FR-58、仕様決定 CI）。公開 7 日経過ルールで
# 2.8.1（公開 4 日）を避けて 2.8.0 に固定。
# ライセンス: MIT OR Apache-2.0
tauri-plugin-notification = "=2.8.0"
# エクスポート/インポートのファイル選択ダイアログ（FR-62、仕様決定 CM）。
# ライセンス: Apache-2.0 OR MIT
tauri-plugin-dialog = "=2.8.4"

[target."cfg(windows)".dependencies]
windows-registry = "0.6"
# mpv 窓の前面化（FR-42、仕様決定 BR）。HWND の特定と前面化 API。
# ライセンス: MIT OR Apache-2.0
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# mpv 窓の前面化（FR-42、仕様決定 BR）。X11 で `window-id` の XID へ
# EWMH `_NET_ACTIVE_WINDOW` を送る。0.14 では純粋 Rust 接続が既定で
# libxcb 非依存（default-features = false で拡張プロトコルも省く）。
# ライセンス: MIT OR Apache-2.0
x11rb = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"


# 最適化ガイドライン: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
