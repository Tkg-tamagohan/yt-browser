[package]
name = "yt-browser"
version = "0.2.0"
description = "YouTube 専用ブラウザ（専ブラ）"
authors = ["Tkg-tamagohan"]
edition = "2021"

[lib]
# `_lib` サフィックスは冗長に見えるが、lib 名と bin 名の衝突を避けるために必要。
# 主に Windows 向けの問題。https://github.com/rust-lang/cargo/issues/8519
name = "yt_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "sync",
  "time",
] }
url = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
roxmltree = "0.20"
aho-corasick = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"


# 最適化ガイドライン: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
