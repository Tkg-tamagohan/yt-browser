name: release

# タグ push (v*) でリリースを作る。Tauri バンドル（Windows は NSIS/MSI、
# Linux は AppImage/deb）をビルドして GitHub Releases に置く。
# 両 OS のビルドが揃ってから release ジョブが一括で公開する（片方だけ
# 成功した不完全なリリースが残らないようにする）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Tauri が複数フォーマットを出すためディレクトリ単位で回収する
            bundle_glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
            artifact_name: linux
          - os: windows-latest
            bundle_glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
            artifact_name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist
          for f in ${{ matrix.bundle_glob }}; do cp "$f" dist/; done
          ls -la dist
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.artifact_name }}
          path: dist/
          if-no-files-found: error

  release:
    # 両プラットフォームのビルドが成功してからだけ公開する
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
      - name: Create or update GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # チェックアウトしないジョブなので対象リポジトリを明示する
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            # 前回実行が途中で失敗した場合など、既存リリースには差し替え添付する
            gh release upload "${{ github.ref_name }}" --clobber \
              -- *.AppImage *.deb *.exe *.msi
          else
            # ドラフトで作り、アセット添付が揃ってから公開する
            # （添付途中の不完全なリリースが見えないよう公開は最後に行う）
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" --generate-notes --draft
            gh release upload "${{ github.ref_name }}" --clobber \
              -- *.AppImage *.deb *.exe *.msi
          fi
          # 既存リリースがドラフトのまま残った場合もここで公開状態に揃える
          gh release edit "${{ github.ref_name }}" --draft=false
