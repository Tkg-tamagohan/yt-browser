name: release

# タグ push (v*) でリリースを作る。workflow_dispatch は署名ビルドの事前検証用で、
# release ジョブは走らせず Artifact のみ生成する。Tauri バンドル（Windows は NSIS、
# Linux は AppImage/deb/rpm）と updater 用の署名付き成果物をビルドし、
# GitHub Releases に置く。latest.json は両 OS の署名成果物が揃った
# 状態で release ジョブが生成する（AppImage と NSIS のみ。仕様決定 AB）
# MSI はビルドも配布もしない（仕様決定 AK）。署名の *.sig は latest.json
# 生成時に読むため dist には集めるが、アセット添付の直前に除く
# Linux 側のランナーは配布物の動作下限を上げないよう ubuntu-24.04 に
# 固定する（仕様決定 AI）。新しいイメージでビルドすると AppImage の
# 要求 glibc と deb/rpm の依存版指定が新しいディストロ基準へ上がるため。
# PR からの秘密鍵漏洩を防ぐため pull_request トリガーは置かない（仕様決定 DW）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Windows 署名ビルドのみ実行する（テスト検証用）"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # リリースビルド開始前にドキュメント整合・タグと各ファイルのバージョン一致・
  # 署名秘密鍵の設定有無を数秒で確認し、不整合のまま長時間ビルドへ進むのを防ぐ（仕様決定 DQ・DW）。
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix_json: ${{ steps.plan.outputs.matrix_json }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m py_compile scripts/*.py
      - run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - run: python3 scripts/check_docs_consistency.py
      - name: タグとバージョンおよび署名鍵を検証
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python3 scripts/bump_version.py --check --expect-tag "$TAG_NAME"
          else
            python3 scripts/bump_version.py --check
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY が未設定のため署名付きリリースを作成できません"
            exit 1
          fi
          if [ -z "$CODE_SIGN_PFX_BASE64" ] || [ -z "$CODE_SIGN_PFX_PASSWORD" ]; then
            echo "::error::CODE_SIGN_PFX_BASE64 または CODE_SIGN_PFX_PASSWORD が未設定のため Windows Authenticode 署名を実行できません"
            exit 1
          fi
      - name: ビルドマトリクスを決定
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          WINDOWS_ONLY: ${{ inputs.windows_only }}
        run: |
          python3 <<'EOF'
          import json, os

          linux_entry = {
              "os": "ubuntu-24.04",
              "bundle_glob": "src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/appimage/*.sig src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm",
              "artifact_name": "linux",
              "bundles": "appimage,deb,rpm",
          }
          windows_entry = {
              "os": "windows-latest",
              "bundle_glob": "src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.sig",
              "artifact_name": "windows",
              "bundles": "nsis",
          }

          if os.environ.get("EVENT_NAME") == "workflow_dispatch" and os.environ.get("WINDOWS_ONLY") == "true":
              matrix = [windows_entry]
          else:
              matrix = [linux_entry, windows_entry]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("matrix_json=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          EOF

  build:
    needs: preflight
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.matrix_json) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # updater 用の署名成果物（*.sig）は署名秘密鍵があるときだけ生成される
      # （createUpdaterArtifacts: true）。鍵は GitHub Secrets から供給する
      - name: Verify signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY が未設定です"
            exit 1
          fi
      - name: Build bundles and updater artifacts (Linux)
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Build, Authenticode-sign and verify Windows bundles
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
          CODE_SIGN_TIMESTAMP_URL: ${{ vars.CODE_SIGN_TIMESTAMP_URL }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $workDir = ''
          $pfxPath = ''
          $thumbprint = ''

          try {
              if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_PASSWORD)) {
                  throw "CODE_SIGN_PFX_BASE64 または CODE_SIGN_PFX_PASSWORD が未設定です。"
              }
              if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
                  throw "TAURI_SIGNING_PRIVATE_KEY が未設定です。"
              }

              $workDir = Join-Path $env:RUNNER_TEMP ("codesign-" + [guid]::NewGuid().ToString('N'))
              New-Item -ItemType Directory -Path $workDir -Force | Out-Null

              $pfxPath = Join-Path $workDir 'codesign.pfx'
              $cerPath = Join-Path $workDir 'codesign.cer'
              $signConfigPath = Join-Path $workDir 'tauri-sign.json'

              $pfxBytes = [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64.Trim())
              [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
              [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)

              $securePass = ConvertTo-SecureString -String $env:CODE_SIGN_PFX_PASSWORD -AsPlainText -Force
              $importedCerts = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $securePass)
              if ($importedCerts.Count -ne 1) {
                  throw "PFX 内の証明書数が想定外です ($($importedCerts.Count) 件)。"
              }
              $importedCert = $importedCerts[0]
              $thumbprint = $importedCert.Thumbprint.ToUpperInvariant()

              Export-Certificate -Cert $importedCert -FilePath $cerPath -Force | Out-Null

              # 後続の保険クリーンアップステップ用（公開サムプリントのみ記録）
              [System.IO.File]::AppendAllText(
                  $env:GITHUB_ENV,
                  "CODE_SIGN_CLEANUP_THUMBPRINT=$thumbprint`n",
                  [System.Text.UTF8Encoding]::new($false)
              )

              # ビルド前に PFX ファイルと Secrets 環境変数を破棄し、子プロセスへ渡さない
              $pfxLen = (Get-Item -LiteralPath $pfxPath).Length
              [System.IO.File]::WriteAllBytes($pfxPath, (New-Object byte[] $pfxLen))
              Remove-Item -LiteralPath $pfxPath -Force
              $securePass = $null
              Remove-Item Env:CODE_SIGN_PFX_BASE64 -ErrorAction SilentlyContinue
              Remove-Item Env:CODE_SIGN_PFX_PASSWORD -ErrorAction SilentlyContinue

              $repoRoot = (Get-Location).ProviderPath
              $signScript = (Join-Path $repoRoot 'scripts\sign_windows.ps1').Replace('\', '/')
              $signCfg = @{
                  bundle = @{
                      windows = @{
                          signCommand = @{
                              cmd = 'powershell.exe'
                              args = @(
                                  '-NoProfile',
                                  '-NonInteractive',
                                  '-ExecutionPolicy',
                                  'Bypass',
                                  '-File',
                                  $signScript,
                                  '%1'
                              )
                          }
                      }
                  }
              }
              $signJson = $signCfg | ConvertTo-Json -Depth 10
              [System.IO.File]::WriteAllText($signConfigPath, $signJson, [System.Text.UTF8Encoding]::new($false))

              $env:CODE_SIGN_CERT_THUMBPRINT = $thumbprint
              Write-Host "Tauri Windows ビルドと Authenticode 署名を開始します (Thumbprint=$thumbprint)"
              # Windows PowerShell では pnpm.ps1 が実行ポリシー制約を受け得るため pnpm.cmd を明示する
              & pnpm.cmd tauri build --ci --bundles nsis --config $signConfigPath -- --locked
              if ($LASTEXITCODE -ne 0) {
                  throw "pnpm.cmd tauri build が終了コード $LASTEXITCODE で失敗しました。"
              }

              $appExe = Join-Path $repoRoot 'src-tauri\target\release\yt-browser.exe'
              if (-not (Test-Path -LiteralPath $appExe -PathType Leaf)) {
                  throw "ビルド済みバイナリが見つかりません: $appExe"
              }
              $nsisDir = Join-Path $repoRoot 'src-tauri\target\release\bundle\nsis'
              $nsisExes = @(Get-ChildItem -Path $nsisDir -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue)
              if ($nsisExes.Count -eq 0) {
                  throw "NSIS インストーラが見つかりません: $nsisDir"
              }
              $nsisSigs = @(Get-ChildItem -Path $nsisDir -Filter '*.exe.sig' -File -ErrorAction SilentlyContinue)
              if ($nsisSigs.Count -eq 0) {
                  throw "Tauri updater 用署名 (*.exe.sig) が見つかりません: $nsisDir"
              }

              $verifyTargets = @($appExe) + @($nsisExes | ForEach-Object { $_.FullName })
              $verifyScript = Join-Path $repoRoot 'scripts\verify_windows_signature.ps1'
              & $verifyScript -TargetPaths $verifyTargets -ExpectedThumbprint $thumbprint -TrustCertPath $cerPath
              if ($LASTEXITCODE -ne 0) {
                  throw "verify_windows_signature.ps1 が終了コード $LASTEXITCODE で失敗しました。"
              }
          } finally {
              Remove-Item Env:CODE_SIGN_PFX_BASE64 -ErrorAction SilentlyContinue
              Remove-Item Env:CODE_SIGN_PFX_PASSWORD -ErrorAction SilentlyContinue
              Remove-Item Env:CODE_SIGN_CERT_THUMBPRINT -ErrorAction SilentlyContinue

              if (-not [string]::IsNullOrEmpty($pfxPath) -and (Test-Path -LiteralPath $pfxPath -PathType Leaf)) {
                  try {
                      $len = (Get-Item -LiteralPath $pfxPath).Length
                      [System.IO.File]::WriteAllBytes($pfxPath, (New-Object byte[] $len))
                      Remove-Item -LiteralPath $pfxPath -Force
                  } catch {
                      Write-Warning "一時 PFX の削除に失敗しました: $($_.Exception.Message)"
                  }
              }

              if (-not [string]::IsNullOrEmpty($workDir) -and (Test-Path -LiteralPath $workDir)) {
                  try {
                      Remove-Item -LiteralPath $workDir -Recurse -Force
                  } catch {
                      Write-Warning "一時作業ディレクトリの削除に失敗しました: $($_.Exception.Message)"
                  }
              }

              if (-not [string]::IsNullOrEmpty($thumbprint)) {
                  try {
                      $myPath = "Cert:\CurrentUser\My\$thumbprint"
                      if (Test-Path -LiteralPath $myPath) {
                          Remove-Item -LiteralPath $myPath -Force
                      }
                      if (Test-Path -LiteralPath $myPath) {
                          & certutil.exe -user -delstore My $thumbprint | Out-Null
                      }
                  } catch {
                      Write-Warning "CurrentUser\My の一時証明書削除に失敗しました: $($_.Exception.Message)"
                  }
              }
          }
      - name: Cleanup Windows signing artifacts (failsafe)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $leftoverDirs = @(Get-ChildItem -Path $env:RUNNER_TEMP -Filter 'codesign-*' -Directory -ErrorAction SilentlyContinue)
          foreach ($dir in $leftoverDirs) {
              $pfxLeftovers = @(Get-ChildItem -Path $dir.FullName -Filter '*.pfx' -File -Recurse -ErrorAction SilentlyContinue)
              foreach ($f in $pfxLeftovers) {
                  $len = $f.Length
                  [System.IO.File]::WriteAllBytes($f.FullName, (New-Object byte[] $len))
                  Remove-Item -LiteralPath $f.FullName -Force
              }
              Remove-Item -LiteralPath $dir.FullName -Recurse -Force
              Write-Host "保険クリーンアップで一時ディレクトリを削除しました: $($dir.FullName)"
          }

          $tp = $env:CODE_SIGN_CLEANUP_THUMBPRINT
          if (-not [string]::IsNullOrWhiteSpace($tp)) {
              $tp = $tp.Trim().ToUpperInvariant()
              $myPath = "Cert:\CurrentUser\My\$tp"
              if (Test-Path -LiteralPath $myPath) {
                  Remove-Item -LiteralPath $myPath -Force
                  if (Test-Path -LiteralPath $myPath) {
                      & certutil.exe -user -delstore My $tp | Out-Null
                  }
              }
              $rootPath = "Cert:\LocalMachine\Root\$tp"
              if (Test-Path -LiteralPath $rootPath) {
                  Remove-Item -LiteralPath $rootPath -Force
              }

              if ((Test-Path -LiteralPath $myPath) -or (Test-Path -LiteralPath $rootPath)) {
                  throw "証明書ストアに一時証明書が残存しています ($tp)。"
              }
          }

          $remainingDirs = @(Get-ChildItem -Path $env:RUNNER_TEMP -Filter 'codesign-*' -Directory -ErrorAction SilentlyContinue)
          if ($remainingDirs.Count -gt 0) {
              throw "RUNNER_TEMP に codesign-* が残存しています。"
          }
          Write-Host "Windows 署名一時ファイルの残存ゼロを確認しました。"
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in ${{ matrix.bundle_glob }}; do cp "$f" dist/; done
          ls -la dist
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.artifact_name }}
          path: dist/
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 90 }}
          if-no-files-found: error

  release:
    # タグ push 時かつ両プラットフォームのビルドが成功してからだけ公開する
    if: github.event_name == 'push'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bundles-*
          # 成果物は専用ディレクトリに集める。リポジトリルートに混ざると
          # 後段の `gh release upload` のワイルドカードがディレクトリを
          # 拾って失敗する
          path: dist
          merge-multiple: true
      # Chrome 拡張（extension/）は未パッケージ読み込み用に zip で配布する
      # （ストア未公開のため .crx ではなく .zip）
      - name: Package Chrome extension
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          (cd extension && zip -r ../dist/yt-browser-extension-${TAG_NAME}.zip . -x "*.test.js")
      - name: Generate updater manifest (latest.json)
        env:
          # release ジョブでも配布先リポジトリを明示して渡す
          GH_REPO: ${{ github.repository }}
          # タグ名は run へ直接展開せず env 経由で受け取る
          # （$(...) 等を含むタグ名がコマンドとして実行されるのを防ぐ）
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/make_latest_json.py "$GH_REPO" "$TAG_NAME" dist > dist/latest.json
          cat dist/latest.json
      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # *.sig は latest.json の signature 読み取り専用。updater の検証は
          # マニフェスト内の署名文字列で行い .sig を DL しないため、
          # アセット一覧を簡素化するため添付対象から外す（仕様決定 AK）
          rm -f dist/*.sig
          ls -la dist
          python3 scripts/verify_release.py "$GH_REPO" "$TAG_NAME" dist
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            # 既存リリースへの再実行（タグ張り替え）では --clobber が同名
            # アセットしか差し替えない。配布廃止した形式と添付対象外の
            # 残存アセットを先に落として新規作成と同じ配布内容に揃える
            # （仕様決定 AK、Devin Review #61 指摘）
            # grep で絞ると対象なし時に終了コード 1 で pipefail 落ちするため、
            # マッチは jq 側で行い空ならループを回さない
            gh release view "$TAG_NAME" --json assets \
              --jq '.assets[].name | select(endswith(".msi") or endswith(".sig"))' | \
            while IFS= read -r name; do
              [ -n "$name" ] && gh release delete-asset "$TAG_NAME" "$name" --yes
            done
            # 前回実行が途中で失敗した場合など、既存リリースには差し替え添付する
            gh release upload "$TAG_NAME" --clobber -- dist/*
          else
            # ドラフトで作り、アセット添付が揃ってから公開する
            # （添付途中の不完全なリリースが見えないよう公開は最後に行う）
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" --generate-notes --draft
            gh release upload "$TAG_NAME" --clobber -- dist/*
          fi
          # 既存リリースがドラフトのまま残った場合もここで公開状態に揃える
          gh release edit "$TAG_NAME" --draft=false
