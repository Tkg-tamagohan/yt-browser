name: release

# タグ push (v*) でリリースを作る。Tauri バンドル（Windows は NSIS/MSI、
# Linux は AppImage/deb/rpm）と updater 用の署名付き成果物をビルドし、
# GitHub Releases に置く。latest.json は両 OS の署名成果物が揃った
# 状態で release ジョブが生成する（AppImage と NSIS のみ。仕様決定 AB）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # updater 成果物（*.AppImage.tar.gz + .sig）と配布物を回収する
            bundle_glob: "src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz src-tauri/target/release/bundle/appimage/*.sig src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm"
            artifact_name: linux
          - os: windows-latest
            bundle_glob: "src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.sig src-tauri/target/release/bundle/msi/*.msi"
            artifact_name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # updater 用の署名成果物（*.sig）は署名秘密鍵があるときだけ生成される
      # （createUpdaterArtifacts: true）。鍵は GitHub Secrets から供給する
      - name: Build bundles and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in ${{ matrix.bundle_glob }}; do cp "$f" dist/; done
          ls -la dist
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.artifact_name }}
          path: dist/
          if-no-files-found: error

  release:
    # 両プラットフォームのビルドが成功してからだけ公開する
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          # 成果物は専用ディレクトリに集める。リポジトリルートに混ざると
          # 後段の `gh release upload` のワイルドカードがディレクトリを
          # 拾って失敗する
          path: dist
          merge-multiple: true
      - name: Generate updater manifest (latest.json)
        env:
          # チェックアウトしないジョブなので対象リポジトリを明示する
          GH_REPO: ${{ github.repository }}
          # タグ名は run へ直接展開せず env 経由で受け取る
          # （$(...) 等を含むタグ名がコマンドとして実行されるのを防ぐ）
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/make_latest_json.py "$GH_REPO" "$TAG_NAME" dist > dist/latest.json
          cat dist/latest.json
      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ls -la dist
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            # 前回実行が途中で失敗した場合など、既存リリースには差し替え添付する
            gh release upload "$TAG_NAME" --clobber -- dist/*
          else
            # ドラフトで作り、アセット添付が揃ってから公開する
            # （添付途中の不完全なリリースが見えないよう公開は最後に行う）
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" --generate-notes --draft
            gh release upload "$TAG_NAME" --clobber -- dist/*
          fi
          # 既存リリースがドラフトのまま残った場合もここで公開状態に揃える
          gh release edit "$TAG_NAME" --draft=false
