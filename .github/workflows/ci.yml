name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ubuntu ランナーは ubuntu-26.04 に明示固定する（仕様決定 AI）。
  # ドキュメント・メタファイルのみの変更時は、必須チェック `CI`（ci-status）を
  # 永久 Pending にしないためワークフロー自体は起動し、本ジョブの判定結果で
  # ビルド・テスト系ジョブだけを安全側でスキップする（仕様決定 DQ）。
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run_frontend: ${{ steps.filter.outputs.run_frontend }}
      run_rust: ${{ steps.filter.outputs.run_rust }}
      run_windows: ${{ steps.filter.outputs.run_windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci_changes.py \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA" \
            --before "$PUSH_BEFORE_SHA" \
            --after "$PUSH_AFTER_SHA"

  # docs↔コード整合・バージョン・開発スクリプトの機械チェック（常時実行）。
  # Python 標準ライブラリのみで動く軽量ジョブとして独立させ、
  # ドキュメントのみの変更時でも仕様整合の検証を省略しない。
  consistency:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m py_compile scripts/*.py
      - run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - run: python3 scripts/check_docs_consistency.py
      - run: python3 scripts/bump_version.py --check
      - run: python3 scripts/e2e_dev.py --dry-run

  frontend:
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  rust:
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  # Windows 固有コード（名前付きパイプ IPC 等）の回帰防止。
  # fmt は OS 非依存なので rust ジョブに任せ、clippy と test のみ実行する。
  windows:
    needs: changes
    if: needs.changes.outputs.run_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  # ルールセットの必須チェックをこのジョブ 1 本に集約する。
  # 必須チェックとして報告される名前はジョブの name（CI）になる。
  # 依存ジョブ失敗・スキップ時も if: always() で必ず起動し、
  # changes / consistency は success 必須、スキップ対象ジョブは
  # changes の判定結果（true なら success / false なら skipped）と一致した
  # ときだけ成功とする（仕様決定 DQ）。
  # ジョブ追加・改名時は needs も更新すること（インラインの [a, b] 形式で
  # 書く。網羅は consistency ジョブの check_docs_consistency.py が照合する）。
  ci-status:
    name: CI
    needs: [changes, consistency, frontend, rust, windows]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: always()
    steps:
      - name: 依存ジョブの結果を集約
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 <<'EOF'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          changes_info = needs.get("changes", {})
          outputs = changes_info.get("outputs", {}) or {}
          conditional = {
              "frontend": "run_frontend",
              "rust": "run_rust",
              "windows": "run_windows",
          }

          bad = []
          for name, info in sorted(needs.items()):
              actual = info.get("result")
              if name in conditional:
                  flag = outputs.get(conditional[name])
                  expected = "success" if flag == "true" else "skipped"
              else:
                  expected = "success"
              print(f"{name}: actual={actual} expected={expected}")
              if actual != expected:
                  bad.append(f"{name} ({actual} != {expected})")

          if bad:
              print("mismatched jobs:", ", ".join(bad))
              sys.exit(1)
          print("all required jobs satisfied")
          EOF
