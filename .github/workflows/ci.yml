name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs↔コード整合の機械チェック（監査対応）。
  # Python 標準ライブラリのみで動く軽量ジョブとして独立させ、
  # 「文書ずれ」だけを即座に識別できるようにする。
  # Rust 側の DDL 照合テスト（CL-1a）は rust/windows ジョブの cargo test に乗る。
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs_consistency.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # Windows 固有コード（名前付きパイプ IPC 等）の回帰防止。
  # fmt は OS 非依存なので rust ジョブに任せ、clippy と test のみ実行する。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # ルールセットの必須チェックをこのジョブ 1 本に集約する。
  # 必須チェックとして報告される名前はジョブの name（CI）になる。
  # 依存ジョブ失敗時はこのジョブ自体が skip され Success 扱いで
  # 素通りになるため、if: always() で必ず起動し、全ジョブの result が
  # success のときだけ成功とする（skipped も失敗扱いの厳格仕様）。
  # ジョブ追加・改名時は needs も更新すること（インラインの [a, b] 形式で
  # 書く。網羅は consistency ジョブの check_docs_consistency.py が照合する）。
  ci-status:
    name: CI
    needs: [consistency, frontend, rust, windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 依存ジョブの結果を集約
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          for name, info in needs.items():
              print(f"{name}: {info['result']}")
          bad = sorted(k for k, v in needs.items() if v["result"] != "success")
          if bad:
              print("non-success jobs:", ", ".join(bad))
              sys.exit(1)
          print("all jobs succeeded")
          EOF

